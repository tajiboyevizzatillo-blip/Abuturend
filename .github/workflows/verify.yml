# Pull request va main push uchun tekshiruv (verify).
#
# Oldin faqat deploy ishlaydi: test, lint yoki typecheck umuman ishga
# tushmasdi, shuning uchun main ga tushgan har qanday kod tekshiruvsiz
# serverga yetib borardi. Bu ish hech qanday maxfiy kalit ishlatmaydi.
name: verify

on:
  # workflow_call is required: deploy.yml calls this workflow as a gate
  # (`uses: ./.github/workflows/verify.yml`). Without it GitHub rejects the
  # reference outright and the deploy job never starts.
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN faqat o'qish uchun.
permissions:
  contents: read

# Deliberately no `concurrency` block here. A reusable workflow inherits the
# caller's ref, so on a push to main this workflow runs twice (standalone +
# as deploy's gate) with the same ref. A shared group would make the second run
# cancel the first — including the very run the deploy is waiting on. (The
# caller cannot override concurrency in a called workflow, so it cannot be fixed
# from deploy.yml.)
#
# The standalone PR runs are cheap and idempotent, so no cancellation is needed.

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f # v5.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django system checks
        working-directory: backend
        env:
          # SQLite so the suite runs without a Postgres service; the code paths
          # under test are database-agnostic (weak_skills uses a CASE/SUM form
          # that works on both engines).
          DJANGO_USE_SQLITE: "1"
        run: python manage.py check

      - name: Missing migrations
        working-directory: backend
        env:
          DJANGO_USE_SQLITE: "1"
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite
        working-directory: backend
        env:
          DJANGO_USE_SQLITE: "1"
        run: python manage.py test --noinput

  frontend:
    name: frontend lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        # The rewrite target is a build-time value, so it must be supplied here
        # or the artifact would bake in the 127.0.0.1 default.
        env:
          BACKEND_URL: http://backend:8000
        run: npm run build

  compose:
    name: compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate compose file
        # Required variables are supplied here only to prove the file parses;
        # these are throwaway values, never deployed.
        env:
          DJANGO_SECRET_KEY: ci-placeholder-secret-key-not-used-anywhere-0123456789
          POSTGRES_PASSWORD: ci-placeholder-password
          MCP_API_KEY: ci-placeholder-mcp-key
        run: docker compose config --quiet