services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abiturend}
      POSTGRES_USER: ${POSTGRES_USER:-abiturend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abiturend}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abiturend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-abituriyent.orgtrace.uz,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://abituriyent.orgtrace.uz}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-https://abituriyent.orgtrace.uz,http://localhost:3000}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      POSTGRES_DB: ${POSTGRES_DB:-abiturend}
      POSTGRES_USER: ${POSTGRES_USER:-abiturend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abiturend}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_HOST: ${TELEGRAM_WEBHOOK_HOST:-}
      # To'lovlar (Payme / Click) — webhook'lari faqat backend'da ishlaydi.
      # Ikkalasi ham bo'sh qoldirilsa webhook fail-closed rad etiladi.
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      CLICK_PAY_URL: ${CLICK_PAY_URL:-https://my.click.uz/services/pay}
      # Email (parol tiklash xatlari) — console backend lokal uchun, prod'da SMTP
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-noreply@abituriyent.orgtrace.uz}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://abituriyent.orgtrace.uz}
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  mcp:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: python -m mcpbridge.server
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      POSTGRES_DB: ${POSTGRES_DB:-abiturend}
      POSTGRES_USER: ${POSTGRES_USER:-abiturend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abiturend}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Fail closed: the bridge refuses every request unless a key is present.
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be set in .env}
      MCP_ADMIN_API_KEY: ${MCP_ADMIN_API_KEY:-}
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: /api

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/srv/static
      - media:/srv/media
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  pgdata:
  media:
  static:
  certbot-www:
  certbot-certs: