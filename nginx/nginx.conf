worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 64;
    server_tokens off;

    # Compressed responses
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # Required, not optional: without it nginx does not compress *proxied*
    # responses (the default is off), so every byte from Next and Django crossed
    # the wire uncompressed — on mobile networks, the main audience here.
    gzip_proxied any;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/wasm
        application/manifest+json
        image/svg+xml
        font/woff2;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Docker embedded DNS: resolve upstream names at request time so
    # container IP churn (rebuilds) never breaks the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Trust the client IP forwarded by our own ingress so DRF's rate limiting
    # buckets per client instead of every visitor sharing the proxy's IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The one Content-Security-Policy this app serves. Kept in a `map` so the
    # exact policy is written once and can be referenced from several blocks
    # (nginx cannot share a plain directive between them).
    #
    # CSP note: script-src needs 'unsafe-inline' because the App Router inlines
    # its flight-data bootstrap scripts and next-themes injects its own. With a
    # bare 'self' the page still renders but never hydrates and every control is
    # dead. A nonce-based policy is the stricter option, but nginx adds the
    # header after Next has rendered, so Next cannot stamp a matching nonce.
    map $host $app_csp {
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://randomuser.me; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # ---- :80 - named domain -> HTTPS redirect (acme stays on :80) ----
    server {
        listen 80;
        server_name abituriyent.orgtrace.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- :80 - default (direct IP access stays on plain HTTP) ----
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20m;

        # Repeated explicitly: nothing is inherited from the http block now.
        # No HSTS here on purpose — this vhost is plain HTTP by design for
        # direct-IP access, and HSTS over an unencrypted response is meaningless.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "$app_csp" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot/;
        }

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/ {
            set $upstream http://mcp:8001;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The MCP bridge authenticates with a bearer token, so this header is
            # mandatory here — without it every request is rejected with 401.
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /static/ {
            alias /srv/static/;
            expires 30d;
            # `expires` emits Cache-Control, and this location's add_header
            # replaces every inherited one — so the full set is restated. CSP is
            # included for consistency even though static assets are not
            # documents.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "$app_csp" always;
        }

        location /media/ {
            alias /srv/media/;
            expires 7d;
            # User-uploaded content: nosniff matters most here, since these are
            # avatars and whatever else a user can store.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "$app_csp" always;
        }
    }

    # ---- :443 - HTTPS ----
    server {
        listen 443 ssl;
        http2 on;
        server_name abituriyent.orgtrace.uz _;

        ssl_certificate /etc/letsencrypt/live/abituriyent.orgtrace.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/abituriyent.orgtrace.uz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_session_timeout 1d;

        client_max_body_size 20m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # nginx's add_header inheritance is all-or-nothing: a level that declares
        # any add_header of its own inherits NONE from above. Because this block
        # sets HSTS and Permissions-Policy, the four headers declared in the http
        # block must be repeated here or they would silently vanish from every
        # HTTPS response — including the CSP, which is the one that matters most.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "$app_csp" always;

        location / {
            set $upstream http://frontend:3000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The aggregate endpoints (stats/summary, weak-skills) do real DB work
            # and can exceed nginx's 60s default on a small VPS, which would
            # surface as a 504 to the student.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /admin/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /webhooks/ {
            set $upstream http://backend:8000;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/ {
            set $upstream http://mcp:8001;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            # MCP bridge authenticates with a bearer token; forward it.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /static/ {
            alias /srv/static/;
            expires 30d;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "$app_csp" always;
        }

        location /media/ {
            alias /srv/media/;
            expires 7d;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "$app_csp" always;
        }
    }
}